<div class="faqs-section py-5" style="background: white;">
  <div class="container">
    <h2 class="faqs-title text-center mb-4" style="font-weight: 900; font-size: 2.5rem; color: #2bb673;">
      Frequently Asked Questions
    </h2>
    <p class="faqs-description text-center mb-5" style="font-size: 1.2rem; color: #555;">
      Frequently asked questions about downloading videos from social networks.
    </p>
    <div class="accordion accordion-flush" id="faqs-accordion">
      {% for faq in faqs %}
      <div class="accordion-item mb-3 shadow-sm rounded">
        <h2 class="accordion-header" id="faq-heading-{{loop.index}}">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#faq-collapse-{{loop.index}}"
            aria-expanded="false"
            aria-controls="faq-collapse-{{loop.index}}"
            style="background-color: #36d480; color: white; font-weight: 700; font-size: 1.1rem; border-radius: 0.375rem;"
          >
            {{faq.question}}
          </button>
        </h2>
        <div
          id="faq-collapse-{{loop.index}}"
          class="accordion-collapse collapse"
          aria-labelledby="faq-heading-{{loop.index}}"
          data-bs-parent="#faqs-accordion"
        >
          <div class="accordion-body" style="font-size: 1rem; color: #444;">
            {{faq.answer}}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
